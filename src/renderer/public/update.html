<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZONIX Update</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      background: #090A0F;
      color: #F3F4F6;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
    }

    .card {
      width: 420px;
      background: #0D0E15;
      border: 1px solid #1E2638;
      border-radius: 16px;
      padding: 32px 28px 28px;
      position: relative;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.7);
      animation: cardIn 0.3s ease-out forwards;
      -webkit-app-region: no-drag;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.97) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .logo-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-box svg {
      width: 22px;
      height: 22px;
      fill: #38BDF8;
    }

    .title-area {
      flex: 1;
    }

    .app-name {
      font-size: 16px;
      font-weight: 700;
      color: #F8FAFC;
      letter-spacing: -0.2px;
    }

    .app-subtitle {
      font-size: 13px;
      color: #94A3B8;
      margin-top: 2px;
    }

    .version-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #38BDF8;
      font-size: 12px;
      font-weight: 600;
    }

    /* Status Section */
    .status-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid #1E293B;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .status-text {
      font-size: 13px;
      color: #E2E8F0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38BDF8;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .progress-track {
      height: 6px;
      background: #161D2A;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563EB 0%, #38BDF8 100%);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: #64748B;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
    }

    .btn-exit {
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #1E2638;
      border-radius: 8px;
      color: #94A3B8;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-exit:hover {
      border-color: #334155;
      color: #F8FAFC;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo-box">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="title-area">
        <div class="app-name">ZONIX Dispatcher</div>
        <div class="app-subtitle">Updating system software</div>
      </div>
      <div class="version-badge" id="versionBadge">v1.7.8</div>
    </div>

    <div class="status-card">
      <div class="status-text">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusLabel">Downloading latest update...</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progFill"></div>
      </div>
      <div class="progress-meta">
        <span id="progressMetaText">Please wait a moment</span>
        <span id="progPct">0%</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn-exit" onclick="quitApp()">Exit App</button>
    </div>
  </div>

  <script>
    window.electronAPI?.onUpdateInfo?.((info) => {
      if (info.newVersion) {
        document.getElementById('versionBadge').textContent = 'v' + info.newVersion;
      }
    });

    window.electronAPI?.onDownloadProgress?.((pct) => {
      const rounded = Math.round(pct);
      document.getElementById('progFill').style.width = rounded + '%';
      document.getElementById('progPct').textContent = rounded + '%';

      if (rounded > 0 && rounded < 100) {
        document.getElementById('statusLabel').textContent = `Downloading update (${rounded}%)...`;
        document.getElementById('progressMetaText').textContent = 'Downloading package files';
      } else if (rounded >= 100) {
        document.getElementById('statusLabel').textContent = 'Installing update & restarting...';
        document.getElementById('progressMetaText').textContent = 'Finalizing installation';
        document.getElementById('statusDot').style.background = '#10B981';
      }
    });

    window.electronAPI?.onUpdateError?.((err) => {
      document.getElementById('statusLabel').textContent = 'Unable to complete update.';
      document.getElementById('statusLabel').style.color = '#EF4444';
      document.getElementById('progressMetaText').textContent = err || 'Check network connection';
      document.getElementById('statusDot').style.background = '#EF4444';
    });

    function quitApp() {
      window.electronAPI?.quitApp?.();
    }
  </script>
</body>
</html>
