<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZONIX Update</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: transparent;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    .card {
      width: 420px;
      background: linear-gradient(145deg, #0f1629 0%, #0b0f1e 100%);
      border: 1px solid rgba(0, 212, 255, 0.15);
      border-radius: 20px;
      padding: 36px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0, 212, 255, 0.08), 0 24px 80px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Animated glow border */
    .card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 20px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(0,212,255,0.4), transparent 50%, rgba(139,92,246,0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Background particle shimmer */
    .card::after {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.06) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #00d4ff, #7c3aed);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.3); }
      50%       { box-shadow: 0 0 35px rgba(0, 212, 255, 0.6); }
    }

    .logo-text { color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 2px; }
    .logo-sub  { color: rgba(0, 212, 255, 0.6); font-size: 10px; letter-spacing: 3px; font-weight: 500; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 212, 255, 0.08);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 20px;
      padding: 4px 12px;
      color: #00d4ff;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      margin-bottom: 16px;
    }

    .badge-dot {
      width: 6px; height: 6px;
      background: #00d4ff;
      border-radius: 50%;
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    h1 {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      line-height: 1.3;
    }

    h1 span { color: #00d4ff; }

    .subtitle {
      color: rgba(255,255,255,0.45);
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .version-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
    }

    .version-label { color: rgba(255,255,255,0.35); font-size: 11px; letter-spacing: 1px; }
    .version-arrow { color: rgba(255,255,255,0.2); font-size: 14px; }
    .version-new   { color: #00d4ff; font-size: 13px; font-weight: 700; font-family: monospace; }

    /* Progress bar (hidden until downloading) */
    .progress-wrap {
      display: none;
      margin-bottom: 20px;
    }

    .progress-wrap.visible { display: block; }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #7c3aed);
      border-radius: 4px;
      width: 0%;
      transition: width 0.3s ease;
    }

    .btn-update {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00d4ff 0%, #0099bb 100%);
      border: none;
      border-radius: 12px;
      color: #000;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.25);
    }

    .btn-update:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(0, 212, 255, 0.4);
    }

    .btn-update:active { transform: translateY(0); }
    .btn-update:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-quit {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: rgba(255,255,255,0.3);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }

    .btn-quit:hover {
      border-color: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.03);
    }

    .status-text {
      text-align: center;
      color: rgba(0, 212, 255, 0.7);
      font-size: 11px;
      margin-top: 14px;
      min-height: 16px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <div class="logo-icon">⚡</div>
      <div>
        <div class="logo-text">ZONIX</div>
        <div class="logo-sub">DISPATCHER</div>
      </div>
    </div>

    <div class="badge"><span class="badge-dot"></span> UPDATE AVAILABLE</div>

    <h1>New Version <span id="newVersion">—</span><br>is Ready</h1>
    <p class="subtitle">
      A required update is available. Install it now to continue using ZONIX Dispatcher with the latest features and fixes.
    </p>

    <div class="version-row">
      <span class="version-label">CURRENT</span>
      <span id="currentVersion" style="color:rgba(255,255,255,0.3);font-size:13px;font-family:monospace;">—</span>
      <span class="version-arrow">→</span>
      <span class="version-label">NEW</span>
      <span class="version-new" id="newVersion2">—</span>
    </div>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-label">
        <span>Downloading update...</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <button class="btn-update" id="btnUpdate" onclick="doUpdate()">
      ⬇ INSTALL UPDATE
    </button>
    <button class="btn-quit" id="btnQuit" onclick="doQuit()">
      Quit Application
    </button>

    <div class="status-text" id="statusText"></div>
  </div>

  <script>
    // Receive update info from main process
    window.electronAPI?.onUpdateInfo?.((info) => {
      document.getElementById('newVersion').textContent  = info.newVersion;
      document.getElementById('newVersion2').textContent = info.newVersion;
      document.getElementById('currentVersion').textContent = info.currentVersion;
    });

    // Receive download progress
    window.electronAPI?.onDownloadProgress?.((pct) => {
      const p = Math.round(pct);
      document.getElementById('progressWrap').classList.add('visible');
      document.getElementById('progressFill').style.width = p + '%';
      document.getElementById('progressPct').textContent  = p + '%';
      document.getElementById('statusText').textContent   = 'Downloading... please wait';
      document.getElementById('btnUpdate').disabled = true;
    });

    function doUpdate() {
      document.getElementById('statusText').textContent = 'Starting download...';
      document.getElementById('btnUpdate').disabled = true;
      window.electronAPI?.startUpdate?.();
    }

    function doQuit() {
      window.electronAPI?.quitApp?.();
    }
  </script>
</body>
</html>
