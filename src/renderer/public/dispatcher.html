<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZONIX // Dispatch Window</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #0b0f19;
      color: #f3f4f6;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .header {
      height: 44px;
      background: #121824;
      border-bottom: 1px solid #222d42;
      display: flex;
      align-items: center;
      padding-left: 16px;
      -webkit-app-region: drag;
      justify-content: space-between;
      user-select: none;
      flex-shrink: 0;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 10px;
      -webkit-app-region: no-drag;
    }
    .logo-img {
      width: 22px;
      height: 22px;
      object-fit: contain;
    }
    .title-text {
      font-size: 13px;
      font-weight: 700;
      color: #3b82f6;
      letter-spacing: 1px;
    }
    .divider {
      color: #222d42;
      font-size: 13px;
    }
    .session-badge {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      color: #9ca3af;
      background: #1b2336;
      border: 1px solid #222d42;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .control-section {
      display: flex;
      align-items: center;
      height: 100%;
      -webkit-app-region: no-drag;
    }
    .signout-btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 16px;
      transition: all 0.2s;
    }
    .signout-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.35);
    }
    .win-btn-container {
      display: flex;
      height: 100%;
    }
    .win-btn {
      width: 46px;
      height: 44px;
      background: transparent;
      border: none;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }
    .win-btn:hover {
      background: #1b2336;
      color: #ffffff;
    }
    .win-btn-close:hover {
      background: #ef4444;
      color: #ffffff;
    }
    .webview-container {
      flex: 1;
      width: 100%;
      background: #000000;
      position: relative;
    }
    webview {
      width: 100%;
      height: 100%;
      border: none;
      display: inline-flex;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0f19;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #9ca3af;
      gap: 12px;
      transition: opacity 0.3s ease;
      pointer-events: none;
      opacity: 1;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #3b82f6;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand-section">
      <img src="./logo.png" alt="ZONIX" class="logo-img">
      <span class="title-text">ZONIX</span>
      <span class="divider">//</span>
      <span class="session-badge" id="sessionBadge">Secure Session</span>
    </div>

    <div class="control-section">
      <button class="signout-btn" id="signOutBtn">Sign Out</button>
      
      <div class="win-btn-container">
        <button class="win-btn" onclick="window.zonixAPI.minimizeWindow()" title="Minimize">
          <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 5h10v1H0z" fill="currentColor"/></svg>
        </button>
        <button class="win-btn" onclick="window.zonixAPI.maximizeWindow()" title="Maximize">
          <svg viewBox="0 0 10 10" width="10" height="10" fill="none" stroke="currentColor"><rect x="1" y="1" width="8" height="8" strokeWidth="1.2"/></svg>
        </button>
        <button class="win-btn win-btn-close" onclick="window.zonixAPI.closeWindow()" title="Close">
          <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="webview-container">
    <webview id="sessionWebview" style="display: none;"></webview>
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <span id="loadingText">Connecting to target site...</span>
    </div>
  </div>

  <script>
    // Extract query parameters
    const params = new URLSearchParams(window.location.search);
    const partition = params.get('partition') || '';
    const url = params.get('url') || 'https://www.google.com';

    console.log('[Dispatcher Wrapper] Initializing webview with:', { partition, url });

    const webview = document.getElementById('sessionWebview');
    const overlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    const sessionBadge = document.getElementById('sessionBadge');
    
    // Set badge based on target url host
    try {
      const u = new URL(url);
      sessionBadge.textContent = u.hostname.toUpperCase();
    } catch(e) {}

    // Apply partition and src
    if (partition) {
      webview.setAttribute('partition', partition);
    }
    webview.setAttribute('src', url);
    webview.style.display = 'inline-flex';

    // Show webview once it starts loading and finishes
    webview.addEventListener('did-start-loading', () => {
      loadingText.textContent = 'Securing tunnel connection...';
    });

    webview.addEventListener('did-finish-load', () => {
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, 300);
    });

    webview.addEventListener('did-fail-load', (e) => {
      if (e.isMainFrame && e.errorCode !== -3) {
        loadingText.innerHTML = `<span style="color:#ef4444">Failed to load target site (Error: ${e.errorDescription})</span>`;
        document.querySelector('.spinner').style.display = 'none';
      }
    });

    // Wire up signout button
    document.getElementById('signOutBtn').addEventListener('click', async () => {
      if (confirm('Are you sure you want to end this secure session?')) {
        await window.zonixAPI.logoutDispatcher();
      }
    });
  </script>
</body>
</html>
