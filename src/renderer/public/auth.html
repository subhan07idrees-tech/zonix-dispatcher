<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZONIX - System Administration Gateway</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #F1F5F9;
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
    }
    .title-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 38px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      padding: 0 0 0 14px;
      -webkit-app-region: drag;
      justify-content: space-between;
      border-bottom: 1px solid #E2E8F0;
    }
    .title-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-bar-badge {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: #172033;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
    }
    .title-bar-text {
      font-size: 12px;
      font-weight: 700;
      color: #1E293B;
      letter-spacing: 0.5px;
    }
    .title-bar-ver {
      font-size: 10px;
      color: #64748B;
      background: #F1F5F9;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #E2E8F0;
      font-family: monospace;
    }
    .window-controls {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
    }
    .win-btn {
      width: 44px;
      height: 38px;
      background: transparent;
      border: none;
      color: #64748B;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }
    .win-btn:hover {
      background: #F1F5F9;
      color: #0F172A;
    }
    .win-btn-close:hover {
      background: #DC2626;
      color: #FFFFFF;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 36px;
      background: #FFFFFF;
      border: 1px solid #D9DEE7;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      text-align: center;
      margin-top: 24px;
    }
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 24px;
    }
    .logo-container {
      width: 48px;
      height: 48px;
      background: #172033;
      border: 1px solid #0F172A;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(23, 32, 51, 0.15);
    }
    .logo-container span {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 800;
      font-family: monospace;
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }
    .subtitle {
      font-size: 12px;
      font-weight: 500;
      color: #64748B;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .form-group label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-group label .hint {
      font-size: 11px;
      font-weight: 400;
      color: #94A3B8;
    }
    .form-group input {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      color: #0F172A;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-group input:focus {
      border-color: #245B9E;
      box-shadow: 0 0 0 3px rgba(36, 91, 158, 0.15);
    }
    .form-group input::placeholder {
      color: #94A3B8;
    }
    .password-wrapper {
      position: relative;
    }
    .password-wrapper input {
      padding-right: 38px !important;
    }
    .password-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #64748B;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      transition: color 0.15s, background-color 0.15s;
    }
    .password-toggle:hover {
      color: #0F172A;
      background: #F1F5F9;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      text-align: left;
    }
    .remember-me input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: #245B9E;
      cursor: pointer;
    }
    .remember-me label {
      font-size: 12px;
      color: #475569;
      cursor: pointer;
      user-select: none;
    }
    .btn {
      width: 100%;
      height: 40px;
      background: #245B9E;
      border: 1px solid #1D4B84;
      border-radius: 6px;
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s, box-shadow 0.15s, transform 0.05s;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }
    .btn:hover {
      background: #1D4B84;
    }
    .btn:active {
      transform: translateY(1px);
    }
    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }
    .error {
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #991B1B;
      display: none;
      text-align: left;
      line-height: 1.4;
    }
    .error.visible {
      display: block;
    }
    .footer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid #E2E8F0;
      font-size: 11px;
      color: #64748B;
    }
    .security-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #059669;
      font-weight: 500;
    }
    .security-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #059669;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #FFFFFF;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="title-bar">
    <div class="title-bar-left">
      <div class="title-bar-badge">Z</div>
      <span class="title-bar-text">ZONIX</span>
      <span class="title-bar-ver" id="appVerTag">v1.8.17</span>
    </div>
    <div class="window-controls">
      <button class="win-btn" type="button" onclick="api.minimizeWindow()" title="Minimize">
        <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 5h10v1H0z" fill="currentColor"/></svg>
      </button>
      <button class="win-btn win-btn-close" type="button" onclick="api.closeWindow()" title="Close">
        <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="brand-header">
      <div class="logo-container">
        <span>Z</span>
      </div>
      <h1 class="title">ZONIX Console</h1>
      <p class="subtitle">System Control & Administration Gateway</p>
    </div>

    <div id="error" class="error"></div>

    <form id="authForm">
      <div class="form-group">
        <label>
          <span>Organization ID</span>
          <span class="hint">Blank for Super Admin</span>
        </label>
        <input type="text" id="orgId" placeholder="e.g. alpha-team" autocomplete="organization">
      </div>
      <div class="form-group">
        <label>
          <span>Username or Email</span>
        </label>
        <input type="text" id="userId" placeholder="admin or superadmin" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>
          <span>Password</span>
        </label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="password-toggle" id="togglePasswordBtn" title="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      
      <div class="remember-me">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Remember credentials on this workstation</label>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span>Sign In to Console</span>
      </button>
    </form>

    <div class="footer-meta">
      <span class="security-tag">
        <span class="security-dot"></span>
        Encrypted TLS Gateway
      </span>
      <span>Enterprise Multi-Tenant</span>
    </div>
  </div>

  <script>
    const api = window.zonixAPI;

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        if (api && api.appVersion) {
          document.getElementById('appVerTag').textContent = 'v' + api.appVersion;
        }
      } catch (e) {}

      const params = new URLSearchParams(window.location.search);
      const errorParam = params.get('error') || (window.location.hash ? window.location.hash.substring(1) : '');
      if (errorParam === 'session_expired') {
        const errorEl = document.getElementById('error');
        errorEl.innerHTML = `<strong>SESSION EXPIRED:</strong> Your credentials were authenticated on another workstation. Please sign in again.`;
        errorEl.classList.add('visible');
      }

      try {
        if (api && api.getConfig) {
          const rememberMe = await api.getConfig('rememberMe');
          if (rememberMe) {
            document.getElementById('rememberMe').checked = true;
            const savedOrg = await api.getConfig('rememberedOrgId');
            const savedUser = await api.getConfig('rememberedUserId');
            if (savedOrg) document.getElementById('orgId').value = savedOrg;
            if (savedUser) document.getElementById('userId').value = savedUser;
          }
        }
      } catch (err) {
        console.error('[Auth] Failed to load remembered credentials:', err);
      }
    });

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const errorEl = document.getElementById('error');

      const orgId = document.getElementById('orgId').value.trim();
      const userId = document.getElementById('userId').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      if (!userId || !password) {
        errorEl.textContent = 'Username and password are required.';
        errorEl.classList.add('visible');
        return;
      }

      if (!orgId && userId !== 'superadmin') {
        errorEl.textContent = 'Organization ID is required for organization administrators and dispatchers. (Only superadmin can leave it empty).';
        errorEl.classList.add('visible');
        return;
      }

      btn.innerHTML = '<span class="spinner"></span><span>Authenticating...</span>';
      btn.disabled = true;
      errorEl.classList.remove('visible');

      try {
        const result = await api.login({ orgId, userId, password });
        if (result.success) {
          if (rememberMe) {
            await api.setConfig('rememberMe', true);
            await api.setConfig('rememberedOrgId', orgId);
            await api.setConfig('rememberedUserId', userId);
          } else {
            await api.setConfig('rememberMe', false);
            await api.setConfig('rememberedOrgId', '');
            await api.setConfig('rememberedUserId', '');
          }

          api.setConfig('orgId', result.orgId);
          api.setConfig('userId', userId);
          document.body.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#F1F5F9;color:#0F172A;font-family:system-ui,sans-serif;gap:12px;">
              <div class="spinner" style="border-color:#245B9E;border-top-color:transparent;width:24px;height:24px;"></div>
              <div style="font-size:13px;font-weight:600;color:#1E293B;letter-spacing:0.3px;">AUTHENTICATED // PROVISIONING CONTROL NODE...</div>
            </div>
          `;
        } else {
          errorEl.textContent = result.error || 'Authentication failed. Please verify Organization ID, username, and password.';
          errorEl.classList.add('visible');
          btn.innerHTML = '<span>Sign In to Console</span>';
          btn.disabled = false;
        }
      } catch (err) {
        errorEl.textContent = 'Connection error: ' + (err.message || 'Unable to connect to backend.');
        errorEl.classList.add('visible');
        btn.innerHTML = '<span>Sign In to Console</span>';
        btn.disabled = false;
      }
    });

    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        togglePasswordBtn.title = 'Hide password';
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        passwordInput.type = 'password';
        togglePasswordBtn.title = 'Show password';
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    });
  </script>
</body>
</html>
