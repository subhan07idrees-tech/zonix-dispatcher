<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in to ZONIX</title>
  <style>
    :root {
      --bg: #F7F7F5;
      --surface: #FFFFFF;
      --surface-hover: #F1F1ED;
      --line: #E6E6E1;
      --line-input: #D9D9D3;
      --ink: #14161B;
      --ink-2: #5B606B;
      --ink-3: #6A6F7B;
      --accent: #2447D6;
      --accent-hover: #1C39B0;
      --accent-press: #162E91;
      --ok: #1A7F55;
      --ok-bg: #E4F4EB;
      --ok-ink: #14633F;
      --err: #B4261E;
      --err-bg: #FDECEA;
      --err-ink: #8F1D17;
      --r-ctl: 8px;
      --r-card: 12px;
      --focus: 0 0 0 2px #FFFFFF, 0 0 0 4px #2447D6;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Window Drag Title Bar */
    .title-bar {
      height: 44px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 16px;
      -webkit-app-region: drag;
      z-index: 100;
      flex-shrink: 0;
    }
    .title-bar-left {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .title-bar-left .ctx {
      color: var(--ink-2);
      font-weight: 500;
    }
    .title-bar-left .sep {
      color: var(--ink-3);
    }
    .title-bar-left .cur {
      color: var(--ink);
      font-weight: 600;
    }
    .window-controls {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
    }
    .win-btn {
      width: 46px;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--ink-2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 120ms, color 120ms;
    }
    .win-btn:hover {
      background: var(--surface-hover);
      color: var(--ink);
    }
    .win-btn-close:hover {
      background: #E81123;
      color: #FFFFFF;
    }

    /* Main Container */
    .main-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-box {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .brand-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-mark {
      margin-bottom: 16px;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--ink);
      line-height: 28px;
    }
    .brand-subtitle {
      font-size: 14px;
      color: var(--ink-2);
      margin-top: 4px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-card);
      padding: 32px;
      box-shadow: none;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .form-control {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line-input);
      border-radius: var(--r-ctl);
      padding: 0 12px;
      font-size: 13px;
      color: var(--ink);
      background: var(--surface);
      font-family: inherit;
      transition: border-color 120ms;
    }
    .form-control.font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .form-control::placeholder {
      color: var(--ink-3);
    }
    .form-control:focus {
      outline: none;
      box-shadow: var(--focus);
    }

    .password-wrapper {
      position: relative;
    }
    .password-wrapper input {
      padding-right: 36px;
    }
    .password-toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--ink-2);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .password-toggle:hover {
      color: var(--ink);
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      color: var(--ink-2);
      cursor: pointer;
    }
    .remember-me input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      height: 40px;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: var(--r-ctl);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 120ms;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }
    .btn-primary:active:not(:disabled) {
      background: var(--accent-press);
    }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .error-msg {
      background: var(--err-bg);
      border: 1px solid var(--line-input);
      color: var(--err-ink);
      padding: 10px 12px;
      border-radius: var(--r-ctl);
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
      line-height: 1.4;
    }
    .error-msg.visible {
      display: block;
    }

    .footer-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: var(--ink-3);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Title bar -->
  <div class="title-bar">
    <div class="title-bar-left">
      <span class="ctx">System</span>
      <span class="sep">/</span>
      <span class="cur">Sign in to ZONIX</span>
    </div>
    <div class="window-controls">
      <button class="win-btn" type="button" onclick="api.minimizeWindow()" title="Minimize" aria-label="Minimize">
        <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 5h10v1H0z" fill="currentColor"/></svg>
      </button>
      <button class="win-btn win-btn-close" type="button" onclick="api.closeWindow()" title="Close" aria-label="Close">
        <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
      </button>
    </div>
  </div>

  <div class="main-wrap">
    <div class="login-box">
      <!-- Brand Header -->
      <div class="brand-header">
        <div class="brand-mark">
          <svg width="44" height="44" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 0H150L57 120L0 150L22 120L89 30H0V0Z" fill="#3B4A63"/>
            <path d="M57 120H150V150H0L57 120Z" fill="#2447D6"/>
          </svg>
        </div>
        <h1 class="brand-title">Sign in to ZONIX</h1>
        <p class="brand-subtitle">System control and dispatch console</p>
      </div>

      <div class="card" id="loginCard">
        <div id="error" class="error-msg"></div>

        <form id="authForm">
          <div class="form-group">
            <label for="orgId">Organization ID</label>
            <input type="text" id="orgId" class="form-control font-mono" placeholder="Tenant ID (leave blank for root console)" autocomplete="organization">
          </div>

          <div class="form-group">
            <label for="userId">Username or email</label>
            <input type="text" id="userId" class="form-control" placeholder="Username or email" required autocomplete="username">
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" class="form-control font-mono" placeholder="••••••••••••" required autocomplete="current-password">
              <button type="button" class="password-toggle" id="togglePasswordBtn" title="Show password" aria-label="Show password">
                <svg id="eyeIcon" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
          
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember this workstation</span>
          </label>

          <button type="submit" class="btn-primary" id="submitBtn">
            <span>Sign in to console</span>
          </button>
        </form>
      </div>

      <div class="footer-status">
        <span class="status-dot"></span>
        <span>Node gateway online · Multi-tenant</span>
      </div>
    </div>
  </div>

  <script>
    const api = window.zonixAPI;

    window.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const errorParam = params.get('error') || (window.location.hash ? window.location.hash.substring(1) : '');
      if (errorParam === 'session_expired') {
        const errorEl = document.getElementById('error');
        errorEl.textContent = 'Session expired. Your credentials were authenticated on another workstation. Please sign in again.';
        errorEl.classList.add('visible');
      }

      try {
        if (api && api.getConfig) {
          const rememberMe = await api.getConfig('rememberMe');
          if (rememberMe !== false) {
            document.getElementById('rememberMe').checked = true;
            const savedOrg = await api.getConfig('rememberedOrgId');
            const savedUser = await api.getConfig('rememberedUserId');
            if (savedOrg) document.getElementById('orgId').value = savedOrg;
            if (savedUser) document.getElementById('userId').value = savedUser;
          } else {
            document.getElementById('rememberMe').checked = false;
          }
        }
      } catch (err) {
        console.error('[Auth] Failed to load remembered credentials:', err);
      }
    });

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const errorEl = document.getElementById('error');

      const orgId = document.getElementById('orgId').value.trim();
      const userId = document.getElementById('userId').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      if (!userId || !password) {
        errorEl.textContent = 'Username and password are required.';
        errorEl.classList.add('visible');
        return;
      }

      if (!orgId && userId !== 'superadmin') {
        errorEl.textContent = 'Organization ID is required for organization dispatchers. (Only superadmin can leave it blank).';
        errorEl.classList.add('visible');
        return;
      }

      btn.innerHTML = '<span class="spinner"></span><span>Signing in…</span>';
      btn.disabled = true;
      errorEl.classList.remove('visible');

      try {
        const result = await api.login({ orgId, userId, password });
        if (result.success) {
          if (rememberMe) {
            await api.setConfig('rememberMe', true);
            await api.setConfig('rememberedOrgId', orgId);
            await api.setConfig('rememberedUserId', userId);
          } else {
            await api.setConfig('rememberMe', false);
            await api.setConfig('rememberedOrgId', '');
            await api.setConfig('rememberedUserId', '');
          }

          api.setConfig('orgId', result.orgId);
          api.setConfig('userId', userId);
          document.body.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#F7F7F5;color:#14161B;font-family:system-ui,sans-serif;gap:12px;">
              <div class="spinner" style="border-color:#2447D6;border-top-color:transparent;width:24px;height:24px;"></div>
              <div style="font-size:13px;font-weight:500;color:#5B606B;">Authenticated · Initializing console…</div>
            </div>
          `;
        } else {
          errorEl.textContent = result.error || 'Authentication failed. Please verify credentials.';
          errorEl.classList.add('visible');
          btn.innerHTML = '<span>Sign in to console</span>';
          btn.disabled = false;
        }
      } catch (err) {
        errorEl.textContent = 'Connection error: ' + (err.message || 'Unable to connect to backend.');
        errorEl.classList.add('visible');
        btn.innerHTML = '<span>Sign in to console</span>';
        btn.disabled = false;
      }
    });

    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        togglePasswordBtn.title = 'Hide password';
        eyeIcon.innerHTML = '<path d="m2 2 20 20"/><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>';
      } else {
        passwordInput.type = 'password';
        togglePasswordBtn.title = 'Show password';
        eyeIcon.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
      }
    });
  </script>
</body>
</html>
