<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZONIX - System Administration Gateway</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #F8FAFC;
      color: #0F172A;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtle Structural Grid Background */
    .bg-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image: radial-gradient(#0F172A 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Ambient Soft Center Lighting Aura */
    .bg-glow-1 {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30, 64, 175, 0.06) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      pointer-events: none;
      filter: blur(50px);
      animation: ambientPulse 4s ease-in-out infinite alternate;
    }
    .bg-glow-2 {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.06) 0%, transparent 70%);
      bottom: -100px;
      right: -100px;
      pointer-events: none;
      filter: blur(50px);
      animation: ambientPulse 4s ease-in-out infinite alternate;
    }
    @keyframes ambientPulse {
      0% { opacity: 0.6; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1.04); }
    }

    /* Window Drag Title Bar */
    .title-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 38px;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      padding: 0 0 0 14px;
      -webkit-app-region: drag;
      justify-content: space-between;
      border-bottom: 1px solid #E2E8F0;
      z-index: 100;
    }
    .title-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-bar-text {
      font-size: 12px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: 1.5px;
      font-family: 'JetBrains Mono', monospace;
    }
    .title-bar-ver {
      font-size: 10px;
      color: #475569;
      background: #F8FAFC;
      padding: 1.5px 7px;
      border-radius: 5px;
      border: 1px solid #E2E8F0;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }
    .window-controls {
      display: flex;
      height: 100%;
      -webkit-app-region: no-drag;
    }
    .win-btn {
      width: 44px;
      height: 38px;
      background: transparent;
      border: none;
      color: #64748B;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s, color 0.15s;
    }
    .win-btn:hover {
      background: #F1F5F9;
      color: #0F172A;
    }
    .win-btn-close:hover {
      background: #DC2626;
      color: #FFFFFF;
    }

    /* Executive Floating Card */
    .card-wrap {
      width: 100%;
      max-width: 430px;
      padding: 0 16px;
      margin-top: 24px;
      position: relative;
      z-index: 10;
    }
    .card {
      width: 100%;
      padding: 28px 30px 24px;
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      box-shadow: 0 20px 30px -10px rgba(15, 23, 42, 0.12), 0 10px 15px -5px rgba(15, 23, 42, 0.06);
      text-align: center;
      position: relative;
      animation: cardAppear 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: border-color 0.2s;
    }
    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Error Micro-Shake */
    .card.shake {
      animation: cardShake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
      border-color: #FECACA;
    }
    @keyframes cardShake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
      40%, 60% { transform: translate3d(3px, 0, 0); }
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }
    .logo-container {
      position: relative;
      margin-bottom: 8px;
    }
    .logo-aura {
      position: absolute;
      inset: -4px;
      border-radius: 16px;
      background: rgba(30, 64, 175, 0.12);
      filter: blur(8px);
      pointer-events: none;
      animation: ambientPulse 3s ease-in-out infinite alternate;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: 2px;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 2px;
    }
    .subtitle {
      font-size: 11.5px;
      font-weight: 500;
      color: #64748B;
      letter-spacing: 0.1px;
    }

    /* Role Mode Switcher */
    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 3px;
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      margin-bottom: 18px;
    }
    .role-tab {
      padding: 6.5px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      font-size: 11.5px;
      font-weight: 600;
      color: #64748B;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-family: inherit;
    }
    .role-tab.active {
      background: #FFFFFF;
      color: #0F172A;
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }
    .form-group label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      font-weight: 600;
      color: #0F172A;
      margin-bottom: 5px;
    }
    .form-group label .hint {
      font-size: 11px;
      font-weight: 500;
      color: #64748B;
      font-family: 'JetBrains Mono', monospace;
    }
    .form-group input {
      width: 100%;
      height: 40px;
      padding: 0 13px;
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      border-radius: 8px;
      color: #0F172A;
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-group input.font-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #1E40AF;
      box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.12);
    }
    .form-group input::placeholder {
      color: #94A3B8;
    }

    .superadmin-info {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-size: 11.5px;
      color: #475569;
      margin-bottom: 14px;
      text-align: left;
    }

    .password-wrapper {
      position: relative;
    }
    .password-wrapper input {
      padding-right: 38px;
    }
    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: #64748B;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.15s;
    }
    .password-toggle:hover {
      color: #0F172A;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 16px;
      font-size: 12px;
      color: #475569;
      text-align: left;
      font-weight: 500;
    }
    .remember-me input {
      accent-color: #1E40AF;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
    .remember-me label {
      cursor: pointer;
    }

    .btn {
      width: 100%;
      height: 40px;
      background: #1E40AF;
      color: #FFFFFF;
      border: 1px solid #1D4ED8;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: inherit;
    }
    .btn:hover:not(:disabled) {
      background: #1D4ED8;
    }
    .btn:active:not(:disabled) {
      transform: scale(0.985);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .footer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #E2E8F0;
      font-size: 11px;
      color: #64748B;
    }
    .security-tag {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 600;
      color: #047857;
    }
    .radar-ping-wrap {
      position: relative;
      display: inline-flex;
      width: 8px;
      height: 8px;
    }
    .radar-ping {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: #10B981;
      opacity: 0.75;
      animation: radarPingAnim 2s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    .radar-dot {
      position: relative;
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #047857;
    }
    @keyframes radarPingAnim {
      0% { transform: scale(1); opacity: 0.8; }
      75%, 100% { transform: scale(2.4); opacity: 0; }
    }

    .error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      margin-bottom: 14px;
      text-align: left;
      font-weight: 500;
      line-height: 1.4;
      display: none;
    }
    .error.visible {
      display: block;
      animation: errorFadeIn 0.18s ease-out;
    }
    @keyframes errorFadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Title bar -->
  <div class="title-bar">
    <div class="title-bar-left">
      <svg width="18" height="18" viewBox="0 0 48 48" fill="none">
        <path d="M24 3.5L42 12V27C42 36.2 24 44.5 24 44.5C24 44.5 6 36.2 6 27V12L24 3.5Z" fill="#1E40AF" stroke="#3B82F6" stroke-width="2"/>
        <path d="M15 15.5H33L21.5 27H33V32.5H15L26.5 21H15V15.5Z" fill="#38BDF8"/>
      </svg>
      <span class="title-bar-text">ZONIX</span>
      <span class="title-bar-ver" id="appVerTag">v1.9.11</span>
    </div>
    <div class="window-controls">
      <button class="win-btn" type="button" onclick="api.minimizeWindow()" title="Minimize">
        <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 5h10v1H0z" fill="currentColor"/></svg>
      </button>
      <button class="win-btn win-btn-close" type="button" onclick="api.closeWindow()" title="Close">
        <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
      </button>
    </div>
  </div>

  <div class="card-wrap">
    <div class="card" id="loginCard">
      <!-- Brand Header -->
      <div class="brand-header">
        <div class="logo-container">
          <div class="logo-aura"></div>
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <defs>
              <linearGradient id="authLogoBg" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1E40AF" />
                <stop offset="50%" stop-color="#1E3A8A" />
                <stop offset="100%" stop-color="#0B132B" />
              </linearGradient>
              <linearGradient id="authLogoZ" x1="12" y1="10" x2="36" y2="38" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#38BDF8" />
                <stop offset="50%" stop-color="#60A5FA" />
                <stop offset="100%" stop-color="#2563EB" />
              </linearGradient>
              <linearGradient id="authLogoZWhite" x1="14" y1="12" x2="34" y2="36" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="100%" stop-color="#BAE6FD" />
              </linearGradient>
            </defs>
            <path d="M24 3.5L42 12V27C42 36.2 24 44.5 24 44.5C24 44.5 6 36.2 6 27V12L24 3.5Z" fill="url(#authLogoBg)" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M24 7.5L38 14.2V26C38 33.2 24 39.8 24 39.8C24 39.8 10 33.2 10 26V14.2L24 7.5Z" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
            <path d="M15 15.5H33L21.5 27H33V32.5H15L26.5 21H15V15.5Z" fill="url(#authLogoZ)"/>
            <path d="M16.5 17H31.5L21.8 26.5H31.5V31H16.5L26.2 21.5H16.5V17Z" fill="url(#authLogoZWhite)" opacity="0.9"/>
            <circle cx="33" cy="15.5" r="1.5" fill="#38BDF8" />
            <circle cx="15" cy="32.5" r="1.5" fill="#38BDF8" />
          </svg>
        </div>
        <h1 class="title">ZONIX</h1>
        <p class="subtitle">System Control &amp; Dispatch Administration</p>
      </div>

      <!-- Role Selector Tabs -->
      <div class="role-tabs">
        <button type="button" class="role-tab active" id="tabOrg" onclick="setRoleMode('org')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect><path d="M9 22v-4h6v4"></path><path d="M8 6h.01"></path><path d="M16 6h.01"></path><path d="M8 10h.01"></path><path d="M16 10h.01"></path><path d="M8 14h.01"></path><path d="M16 14h.01"></path></svg>
          <span>Org Dispatcher</span>
        </button>
        <button type="button" class="role-tab" id="tabSuper" onclick="setRoleMode('superadmin')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          <span>Super Admin</span>
        </button>
      </div>

      <div id="error" class="error"></div>

      <form id="authForm">
        <!-- Org ID Group -->
        <div class="form-group" id="orgGroup">
          <label>
            <span>Organization ID</span>
            <span class="hint">Assigned Tenant</span>
          </label>
          <input type="text" id="orgId" class="font-mono" placeholder="e.g. alpha-team" autocomplete="organization">
        </div>

        <!-- Superadmin Info Pill (hidden by default) -->
        <div class="superadmin-info" id="superInfo" style="display: none;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
          <span>Direct Root Console Access (Multi-Tenant Scope)</span>
        </div>

        <div class="form-group">
          <label>
            <span>Username or Email</span>
          </label>
          <input type="text" id="userId" placeholder="username or email" required autocomplete="username">
        </div>

        <div class="form-group">
          <label>
            <span>Password</span>
          </label>
          <div class="password-wrapper">
            <input type="password" id="password" class="font-mono" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle" id="togglePasswordBtn" title="Show password">
              <svg id="eyeIcon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        
        <div class="remember-me">
          <input type="checkbox" id="rememberMe">
          <label for="rememberMe">Remember credentials on this workstation</label>
        </div>

        <button type="submit" class="btn" id="submitBtn">
          <span>Sign In to Console</span>
        </button>
      </form>

      <div class="footer-meta">
        <span class="security-tag">
          <span class="radar-ping-wrap">
            <span class="radar-ping"></span>
            <span class="radar-dot"></span>
          </span>
          Direct Node Gateway
        </span>
        <span style="font-family: 'JetBrains Mono', monospace;">Enterprise Multi-Tenant</span>
      </div>
    </div>
  </div>

  <script>
    const api = window.zonixAPI;
    let currentRole = 'org';

    function setRoleMode(role) {
      currentRole = role;
      const tabOrg = document.getElementById('tabOrg');
      const tabSuper = document.getElementById('tabSuper');
      const orgGroup = document.getElementById('orgGroup');
      const superInfo = document.getElementById('superInfo');
      const orgInput = document.getElementById('orgId');
      const userInput = document.getElementById('userId');

      if (role === 'superadmin') {
        tabSuper.classList.add('active');
        tabOrg.classList.remove('active');
        orgGroup.style.display = 'none';
        superInfo.style.display = 'flex';
        orgInput.value = '';
        if (!userInput.value || userInput.value === 'admin') {
          userInput.value = 'superadmin';
        }
      } else {
        tabOrg.classList.add('active');
        tabSuper.classList.remove('active');
        orgGroup.style.display = 'block';
        superInfo.style.display = 'none';
        if (userInput.value === 'superadmin') {
          userInput.value = '';
        }
      }
    }

    function triggerShake() {
      const card = document.getElementById('loginCard');
      card.classList.remove('shake');
      void card.offsetWidth; // force reflow
      card.classList.add('shake');
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        if (api && api.appVersion) {
          document.getElementById('appVerTag').textContent = 'v' + api.appVersion;
        }
      } catch (e) {}

      const params = new URLSearchParams(window.location.search);
      const errorParam = params.get('error') || (window.location.hash ? window.location.hash.substring(1) : '');
      if (errorParam === 'session_expired') {
        const errorEl = document.getElementById('error');
        errorEl.innerHTML = `<strong>SESSION EXPIRED:</strong> Your credentials were authenticated on another workstation. Please sign in again.`;
        errorEl.classList.add('visible');
        triggerShake();
      }

      try {
        if (api && api.getConfig) {
          const rememberMe = await api.getConfig('rememberMe');
          if (rememberMe) {
            document.getElementById('rememberMe').checked = true;
            const savedOrg = await api.getConfig('rememberedOrgId');
            const savedUser = await api.getConfig('rememberedUserId');
            if (savedOrg) document.getElementById('orgId').value = savedOrg;
            if (savedUser) {
              document.getElementById('userId').value = savedUser;
              if (savedUser === 'superadmin' && !savedOrg) {
                setRoleMode('superadmin');
              }
            }
          }
        }
      } catch (err) {
        console.error('[Auth] Failed to load remembered credentials:', err);
      }
    });

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('submitBtn');
      const errorEl = document.getElementById('error');

      const orgId = currentRole === 'superadmin' ? '' : document.getElementById('orgId').value.trim();
      const userId = document.getElementById('userId').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;

      if (!userId || !password) {
        errorEl.textContent = 'Username and password are required.';
        errorEl.classList.add('visible');
        triggerShake();
        return;
      }

      if (!orgId && currentRole === 'org' && userId !== 'superadmin') {
        errorEl.textContent = 'Organization ID is required for organization dispatchers. (Switch to Super Admin tab if authenticating root console).';
        errorEl.classList.add('visible');
        triggerShake();
        return;
      }

      btn.innerHTML = '<span class="spinner"></span><span>Authenticating...</span>';
      btn.disabled = true;
      errorEl.classList.remove('visible');

      try {
        const result = await api.login({ orgId, userId, password });
        if (result.success) {
          if (rememberMe) {
            await api.setConfig('rememberMe', true);
            await api.setConfig('rememberedOrgId', orgId);
            await api.setConfig('rememberedUserId', userId);
          } else {
            await api.setConfig('rememberMe', false);
            await api.setConfig('rememberedOrgId', '');
            await api.setConfig('rememberedUserId', '');
          }

          api.setConfig('orgId', result.orgId);
          api.setConfig('userId', userId);
          document.body.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#F8FAFC;color:#0F172A;font-family:'Plus Jakarta Sans',sans-serif;gap:14px;">
              <div class="spinner" style="border-color:#1E40AF;border-top-color:transparent;width:28px;height:28px;"></div>
              <div style="font-size:12px;font-weight:700;color:#0F172A;letter-spacing:0.5px;font-family:'JetBrains Mono',monospace;">AUTHENTICATED // INITIALIZING CONTROL NODE...</div>
            </div>
          `;
        } else {
          errorEl.textContent = result.error || 'Authentication failed. Please verify credentials.';
          errorEl.classList.add('visible');
          triggerShake();
          btn.innerHTML = '<span>Sign In to Console</span>';
          btn.disabled = false;
        }
      } catch (err) {
        errorEl.textContent = 'Connection error: ' + (err.message || 'Unable to connect to backend.');
        errorEl.classList.add('visible');
        triggerShake();
        btn.innerHTML = '<span>Sign In to Console</span>';
        btn.disabled = false;
      }
    });

    const togglePasswordBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        togglePasswordBtn.title = 'Hide password';
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        passwordInput.type = 'password';
        togglePasswordBtn.title = 'Show password';
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    });
  </script>
</body>
</html>
