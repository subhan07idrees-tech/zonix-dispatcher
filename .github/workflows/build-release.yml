name: Build & Release Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Platform to build'
        required: true
        default: 'mac-only'
        type: choice
        options:
          - 'mac-only'
          - 'windows-only'
          - 'both'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS DMG Client (Apple Silicon & Intel)
    if: github.event.inputs.target == 'mac-only' || github.event.inputs.target == 'both' || github.event_name == 'push'
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix src/renderer

      - name: Build Renderer Frontend
        run: npm run build --prefix src/renderer

      - name: Obfuscate Source Code
        run: node scripts/obfuscate.js --obfuscate

      - name: Build Electron App for macOS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Restore Source Backup
        if: always()
        run: node scripts/obfuscate.js --restore

      - name: Upload macOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zonix-macos-installer
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: warn

      - name: Publish Release Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Setup Client
    if: github.event.inputs.target == 'windows-only' || github.event.inputs.target == 'both' || github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix src/renderer

      - name: Build Renderer Frontend
        run: npm run build --prefix src/renderer

      - name: Obfuscate Source Code
        run: node scripts/obfuscate.js --obfuscate

      - name: Build Electron App for Windows
        run: npx electron-builder --win --publish never

      - name: Restore Source Backup
        if: always()
        run: node scripts/obfuscate.js --restore

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zonix-windows-installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: warn

      - name: Publish Release Assets to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
